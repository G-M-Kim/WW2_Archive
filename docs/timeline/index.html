<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="프롤로그부터 에필로그까지 한 페이지에서 읽는 제2차 세계대전 연표와 사진 기록">
  <title>제2차 세계대전 타임라인 · WW2 Archive</title>
  <link rel="stylesheet" href="timeline.css">
  <script defer src="timeline.js"></script>
</head>
<body>
  <a class="skip" href="#timeline">연표 본문으로 건너뛰기</a>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="brand" href="../">WW2 Archive</a>
      <nav aria-label="위키 메뉴">
        <a href="../chronology/">월별 연표</a>
        <a href="../categories/">7개국 조사</a>
        <a href="../sources/">출처 목록</a>
      </nav>
    </div>
  </header>
  <main>
    <header class="hero">
      <div class="shell hero-inner">
        <p class="date-range" id="date-range">1895–1955</p>
        <h1>제2차 세계대전<br>타임라인</h1>
        <p class="hero-description">전쟁의 전사에서 전후 질서까지, 사건과 사료를 시간순으로 읽는 연표</p>
        <p class="hero-credit"><a href="https://commons.wikimedia.org/wiki/File:Into_the_Jaws_of_Death_23-0455M_edit.jpg">1944년 6월 6일 노르망디 상륙 · Robert F. Sargent</a></p>
      </div>
    </header>
    <div class="shell">
      <noscript><p class="notice">자바스크립트를 켜면 연속 스크롤 연표를 볼 수 있습니다. <a href="../chronology/">월별 연표 열기</a></p></noscript>
      <p id="loading" class="notice" role="status"></p>
      <div id="interactive" hidden>
        <div class="navigation" id="navigation">
          <section class="controls" aria-label="연표 검색 및 이동">
            <label class="search">사건 검색<input id="query" type="search" placeholder="예: 만주사변, EVT-0244" autocomplete="off" aria-controls="results"></label>
            <label>기간 바로가기<select id="period"><option value="">기간 선택</option></select></label>
            <label>날짜 이동<input id="date" type="date"></label>
            <label>출처 상태<select id="status"><option value="">전체</option><option value="0">문헌대조</option><option value="1">링크등록</option><option value="2">미등록</option></select></label>
            <div id="results" class="search-results" hidden></div>
          </section>
          <nav class="period-tabs" id="period-tabs" aria-label="연표 기간 탭">
            <a class="period-tab edge-tab" href="#prologue">프롤로그</a>
            <button class="tab-arrow" id="earlier-tabs" type="button" aria-label="이전 월 탭 보기">‹</button>
            <div class="month-tabs" id="month-tabs"></div>
            <button class="tab-arrow" id="later-tabs" type="button" aria-label="다음 월 탭 보기">›</button>
            <a class="period-tab edge-tab" href="#epilogue">에필로그</a>
          </nav>
        </div>
        <section class="evidence" aria-labelledby="evidence-heading">
          <h2 id="evidence-heading">출처 상태</h2>
          <ul id="evidence-list"></ul>
          <p>문헌대조는 원고에 명시된 근거를 확인한 범위를 뜻합니다.</p>
        </section>
        <p id="feedback" class="notice" role="status" hidden></p>
        <div id="timeline" tabindex="-1"></div>
      </div>
    </div>
  </main>
  <footer class="shell footer">
    <span><a href="../chronology/">월별 연표</a> · <a href="https://github.com/G-M-Kim/WW2_Archive">GitHub 저장소</a></span>
    <span>기록 이미지는 웹 표시용으로 크기와 형식을 조정했습니다.</span>
    <span>디자인 참고 <a href="https://codepen.io/knyttneve/pen/bgvmma">knyttneve의 Timeline</a></span>
  </footer>
</body>
</html>
