name: Validate WW2 research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate chronology dates and references
        run: python validate_index.py
      - name: Validate 154 category articles and progress JSON
        run: python categories/tools/validate.py
      - name: Install static site generator
        run: python -m pip install -r requirements.txt
      - name: Verify chronology and category site staging
        run: python scripts/build_category_pages.py
      - name: Verify static site generation
        run: zensical build --clean
