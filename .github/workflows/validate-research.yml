name: Validate WW2 research chronology

on:
  push:
    branches: [draft/chronology-index-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate IDs, dates, references and mirrored tables
        run: python validate_index.py
